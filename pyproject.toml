[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "1.0.0"
description = "Find attacks on AWS Bedrock and Bedrock AgentCore in CloudTrail logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Casimir Terrence" }]
keywords = ["aws", "bedrock", "cloudtrail", "detection-engineering", "ai-security", "agentcore", "sigma"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=7.1.0", "pyyaml>=6.0.3", "ruff>=0.6", "boto3>=1.34", "moto[s3,sns,sqs]>=5"]

[project.scripts]
strata = "strata.cli:main"

[tool.setuptools]
packages = ["strata"]

[project.urls]
Homepage = "https://casimirterr.github.io/Strata/"
Source = "https://github.com/CasimirTerr/Strata"
Detections = "https://github.com/CasimirTerr/Strata/blob/main/DETECTIONS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["strata"]
omit = ["strata/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP007", "UP045", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Rule descriptions are user-facing sentences; splitting them hurts readability more than it helps.
"strata/rules.py" = ["E501"]
