title: 'Bedrock flow changed'
id: 0450cf32-e2fc-5efe-9e6f-aeb7b1f1aa01
status: experimental
description: 'Flow edits can reroute inputs and outputs to attacker endpoints in a pipeline nobody watches. (Strata ST-008)'
references:
    - https://thehackernews.com/2026/03/we-found-eight-attack-vectors-inside.html
    - https://unit42.paloaltonetworks.com/exploit-of-aws-agentcore-iam-god-mode/
    - https://github.com/CasimirTerr/Strata
author: Casimir Terrence
date: 2026-11-03
tags:
    - attack.t1565.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource:
            - bedrock.amazonaws.com
            - bedrock-agent.amazonaws.com
        eventName:
            - UpdateFlow
            - UpdateFlowAlias
    condition: selection
falsepositives:
    - 'Normal flow development.'
level: medium
