title: 'Invocation logging settings checked'
id: 23e2b8a1-9c64-5e38-a5e5-7328ca4ab68d
status: experimental
description: 'Attackers check whether prompts are being logged before they start using stolen access. (Strata ST-012)'
references:
    - https://thehackernews.com/2026/03/we-found-eight-attack-vectors-inside.html
    - https://unit42.paloaltonetworks.com/exploit-of-aws-agentcore-iam-god-mode/
