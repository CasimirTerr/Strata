name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" mypy
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy strata --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Scan the sample logs
        run: |
          strata scan examples/normal-day --fail-on critical
          strata scan examples/attack-night -f md -o attack-report.md
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: sample-attack-report
          path: attack-report.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e .
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Web page matches the Python engine; replay and chat work
        run: npm run check:web

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate

  lambda-package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_lambda.py
      - uses: actions/upload-artifact@v7
        with:
          name: strata-lambda
          path: build/strata-lambda.zip
