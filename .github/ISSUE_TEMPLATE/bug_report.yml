name: Bug report
description: Strata missed something, flagged something it shouldn't have, or crashed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: event
    attributes:
      label: The CloudTrail event
      description: Paste the event that caused it, with account IDs, ARNs, IPs and anything sensitive replaced.
      render: json
  - type: input
    id: version
    attributes:
      label: Strata version
      placeholder: output of `strata --version`
